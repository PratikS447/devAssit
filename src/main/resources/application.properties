spring.application.name=DevOpsBuddy

# Set DEVOPSBUDDY_API_KEY to a random value of at least 32 characters before
# calling /api/**. The API remains inaccessible when the key is unset.
devopsbuddy.api.key=${DEVOPSBUDDY_API_KEY:}

# The model host and model can be replaced without changing source code.
devopsbuddy.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
devopsbuddy.ollama.model=${OLLAMA_MODEL:deepseek-r1:1.5b}
devopsbuddy.ollama.timeout=${OLLAMA_TIMEOUT:30s}

# Safe by default. Only fixed, read-only command operations are available.
devopsbuddy.execution.enabled=${COMMAND_EXECUTION_ENABLED:false}
devopsbuddy.execution.timeout=${COMMAND_EXECUTION_TIMEOUT:10s}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
